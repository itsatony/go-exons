manifest_version: "1.0"
project:
  name: go-exons
  version: 0.29.0
# v0.29.0 (DC17b): AN EMPTY COLLECTION IS NOT AN ANSWER TO A REQUIRED INPUT.
# ⛔ 0.28.0's required check was a NO-OP FOR EVERY COLLECTION KIND, found by review. It reused
# isUnboundInputValue, which treats only nil and "" as unbound — right for BINDING, where an
# untouched field and a cleared field are one gesture — so an explicit `[]` passed as "present",
# nothing else constrained it (option membership and max_files are both vacuous on an empty
# list), and the binding validated CLEAN while the rendered prompt still had a hole in it.
# ⭐ NOT A CORNER CASE: a required `file-upload` is the field type atlas#353 was reported
# against, and {"papers": []} is exactly what a stored routine or a curl sends.
# satisfiesRequired is a SEPARATE predicate on purpose, used ONLY by the required check: binding
# still uses isUnboundInputValue, so a deliberately emptied multiselect keeps its cleared value
# instead of silently reverting to a default.
# ⚠ A SCALAR ZERO IS NOT EMPTY — 0 and false are real answers, guarded, because that direction
# would be worse than the bug. ⚠ No reflection: the shapes reaching here come from JSON/YAML, and
# a reflective emptiness test would start judging caller structs this package does not define.
# ⚠ Applied to BOTH accessors — a fix on one is the drift this file warns about.
# v0.28.0 (DC17-fillin): A RUNTIME CAN ASK WHETHER A CALLER'S FORM WAS ACTUALLY FILLED IN — over the
# inputs the document INHERITS as well as the ones it declares itself. Template.ValidateInputBinding
# joins Spec.ValidateInputBinding with the same rules and the same wording over a different set:
# DeclaredInputs (the merged extends chain) rather than the document's own frontmatter.
# ⛔ THE SPEC-LEVEL ACCESSOR IS A TRAP FOR A TEMPLATE AND THAT IS WHY THIS EXISTS. A document using
# `extends:` declares inputs its ancestors own, and contextWithInputs binds those happily — so a host
# validating through Spec silently skips every INHERITED required input while the executor treats them
# as declared. One rule with two implementations, on the one path a runtime uses to decide whether to
# refuse a request. Its consumer is vaichat2/atlas#353, where `required` was enforced by one browser and
# by nothing else, so a routine firing on a schedule, a curl or an MCP client could render a prompt with
# a hole where an instruction belonged and the model answered as if the user had asked for nothing.
# ⚠ IT RETURNS THE CHAIN ERROR ALONGSIDE THE VIOLATIONS, NEVER INSTEAD OF THEM. A partial chain yields
# a set that is missing declarations rather than one proven clean, so a violation found against it is
# still real — but "no violations" with a non-nil error means NOT PROVEN, not acceptable, and the doc
# comment says so where a caller will read it.
# ⚠ Violations are ordered by input name. The merged set is a map, so range order would make the same
# binding report differently on each run — correct and unstable.
# ⚠ A synthetic Spec{Inputs: merged} was deliberately NOT used, though it works today: it would make
# this function's correctness depend on which OTHER Spec fields OrderedInputKeys happens to read.
# ADDITIVE ONLY — no existing behaviour changes, and Spec.ValidateInputBinding is untouched and still
# right for a consumer that walks composition itself (aigentverse does).
# v0.27.0 (DC16-timbre): an agent can say HOW IT SHOULD SOUND. A spec could describe what an agent is
# and which LLM runs it, but not the voice it should be read aloud in — so in a product where agents are
# coworkers you talk to, every coworker was read in the workspace's one voice. `speech:` is a typed,
# top-level block (SpeechConfig: provider, model, voice, voice_id, instructions, speed, output_format,
# language, region) with a matching $def in the published schema. It is NOT execution.audio and there is
# deliberately NO fallback between the two: execution.* parameterises the call that produces the
# document's OUTPUT, while speech: says how text this document produced should be read back — and
# ExecutionConfig is closed around exactly one provider/model pair, the LLM's, so a voice named there has
# no engine that defines it. `instructions` is the one field that cannot be expressed as a parameter and
# is the whole reason to prefer a steerable TTS model. `region` is FREE-FORM on purpose (downstream it is
# provider-interpreted: "eu", "us", "eu-central-1", "europe-west4"), and neither speech.provider nor
# transcription.provider draws on the ExecutionConfig provider enum, which names LLM vendors and carries
# no TTS/STT-only one — reusing it would refuse values that work today.
# ⚠ SpeechConfig HAS NO Validate() AND THAT IS THE DECISION, not an omission. go-exons stores
# declarations; the bounds live in the schema, which is the published contract. A Go refusal would also
# be a NARROWING shipped in a MINOR: before this release a `speech:` block landed inertly in
# Spec.Extensions, so a document carrying one already parses and validates, and refusing it now would
# break a document that works.
# ⚠ `transcription:` IS DECLARED IN THE SCHEMA AND DELIBERATELY *NOT* A Spec FIELD. It is a live
# convention read as Spec.Extensions["transcription"] (go-vaibstract's ParseExonsTranscriptionSpec), and
# a typed field CONSUMES its key from the inline Extensions map — so typing it would silently empty that
# key and every transcription-configured document would lose its provider, model and region at the
# consumer's next pin bump, with nothing failing anywhere. The schema declares it (editors and CI can
# check it) without moving the value. TestTranscriptionStaysInExtensions pins both halves, and its
# reflection arm is the one that catches a field added under a different tag. The sibling convention
# `transcription_verifications` is real too and is deliberately left undeclared.
# ⚠ AND THE SAME TRAP WAS ALREADY SPRUNG, UNNOTICED, ON `requirements:`. Spec.Requirements has existed
# since DC-SE0 with no SpecFieldRequirements constant, no knownSpecFields entry and no buildSerializeMap
# arm — so the typed field ate the key and no export wrote it back: every Serialize/ExportFull DROPPED
# the block, and `requirements:` had been round-tripping to nothing since it was introduced. Found on the
# exact lines that had to change to keep `speech:` from repeating it. Both are now emitted, under
# IncludeMetadata, which also keeps both OUT of the Agent-Skills card (its portable fields are a closed
# vocabulary, and an extra key there is a conformance failure downstream).
# ⚠ THE ROUND-TRIP GUARD MUST GO THROUGH ExportFull, NEVER yaml.Marshal(spec) — the struct tag does the
# work in a direct marshal, so a direct-marshal test passes against a buildSerializeMap that emits
# nothing. That is exactly how the requirements gap survived. Both new guards were probed by breaking
# them (the emission arms removed; a Transcription field added) and confirmed to fail.
# ⚠ ONE BACKWARD-INCOMPATIBILITY, STATED: a document whose `speech:` value is a SCALAR rather than a
# mapping used to be an inert Extensions value and is now a decode error. No document that parsed with a
# well-formed block can fail to parse.
# The root stays `additionalProperties: true` — Spec.Extensions is an inline catch-all, so an unknown
# top-level key is a supported extension point — and that is now asserted, because this release is the
# first thing to depend on it. The shipped reference document (examples/dns-specialist.exons) grew a
# speech block and is now PARSED by a test; nothing checked it before.
# Downstream: aigentverse re-publishes this schema byte-identically and consumes the block in its own
# cycle (its issue #32, this repo's issue #2).
# v0.26.0 (DC15-unframe): the {~exons.message~} framing has an INVERSE now — StripMessageMarkers —
# because its delimiter is a byte some consumers refuse. The framing is \x00MSG_START:<role>:<cache>:
# ... \x00MSG_END\x00; the NUL is deliberate (it cannot collide with prompt content) and the contract
# is that a consumer calls ExtractMessages. NOT EVERY CONSUMER IS A MESSAGE SPLITTER, and for those the
# NUL is not neutral: measured downstream (vaichat2 -> thalamus -> postgres) a jsonb column REFUSES
# \u0000 (SQLSTATE 22P05), so a chat send using such a prompt template died with an opaque
# DB_EXEC_FAILED 500 and the byte was visible only in postgres's own CONTEXT line. StripMessageMarkers
# is for the caller holding ONE string: it keeps message contents AND unmarked prose in source order,
# and returns marker-free output byte-identical. It FLATTENS roles and is not a substitute for
# ExtractMessagesFromOutput — which conversely DISCARDS every word written outside a message tag, the
# reason the obvious "just extract" fix is wrong. A bare NUL that is not framing is left alone.
# v0.25.0 (DC14-collate): every inheritance failure is MACHINE-MATCHABLE, and the tag it names is the
# verb the author wrote. No new capability — this makes one already-existing condition answerable by a
# consumer, which is what a registry needs in order to answer it with a status code instead of a 500.
# THE DEFECT WAS AN ASYMMETRY BETWEEN SIBLINGS. resolveInheritance can fail three ways. Two returned a
# typed cuserr carrying tag=extends; the third — the parent was NAMED and the chain could not be
# walked (absent, circular, over-deep) — returned the resolver's own *internal.BuiltinError: an
# unexported type from internal/ with no Unwrap, no code and no cuserr metadata. So a consumer could
# machine-match two of three inheritance failures and had to string-match the third. Meanwhile the
# SPECS walk (ancestorSpecs) already reported ALL of its conditions as typed errors, so one template
# answered "can this chain be resolved?" in two vocabularies depending on which walk asked. Closed by
# wrapping at the public boundary — NewInheritanceResolutionError, the execute-walk twin of
# NewInheritanceChainError — preserving the resolver's reason as the cause and naming the declared
# parent in template_name.
# ⚠ MESSAGE CHANGE, and it is the user-visible half: NewTemplateNotFoundBuiltinError hardcoded
# TagNameInclude, so an unresolvable extends reported itself as "exons.include: template not found" —
# a message naming a verb the author never wrote, on the one failure where knowing which verb it was
# IS the diagnosis. It had EXACTLY ONE call site, the inheritance one, so the constructor had never
# once been right. Now tag-parameterized and called with TagNameExtends.
# ⚠ AND THE CONTRACT IS THE TAG, NEVER THE CODE. Found while writing the test that asserts it:
# `ErrCodeExec` reads like a code and is not one. cuserr's NewValidationError(field, message) takes a
# FIELD and WrapStdError(err, context, message) takes a CONTEXT, so every go-exons constructor has been
# passing ErrCodeExec as a metadata label while .Code was derived elsewhere — and derived by
# FromStdError SUBSTRING-MATCHING THE CAUSE'S PROSE ("not found", "invalid", "exists"). The code of an
# inheritance failure is therefore decided by the wording of the message underneath it: the three
# failures produce three different codes today, and rephrasing any cause would silently change a
# fourth. A test pins that disagreement on purpose, so "just match on .Code" cannot ship as a cleanup.
# THE LESSON: A CONTRACT THAT HOLDS FOR MOST OF A SET IS NOT A CONTRACT. Two-of-three typed is
# indistinguishable from three-of-three at every call site that has only ever hit the typed two, so the
# only test that can find it is a table over the WHOLE set — which is why this one enumerates rather
# than asserts. And the first draft of that table asserted .Code and passed nowhere, which is how the
# prose-derived code was found at all: an assertion that fails for a reason you did not predict is
# worth more than one that passes.
#
# v0.24.0 (DC13-entail): the EXECUTOR honours what the document declared. 0.19.0-0.23.0 finished the
# typed-input FORMAT; the executor was not finished, and v0.21.0's "Known gaps" block was four
# instances of ONE defect — a value is computed, then dropped on the floor between the phase that
# computed it and the phase that needs it. Attributes parsed and discarded; a parent Spec loaded and
# never consulted; a refusal written and never invoked; an error stored on a field one caller reads.
# Two more of the same class were found while planning. All six fixed.
# ⚠ THREE BEHAVIOUR CHANGES: (1) extends with NO ENGINE is now an error instead of a no-op returning
# nil — the child used to render its own body ALONE and report success, i.e. a different document
# than the author wrote presented as the one they wrote; same for a discarded inheritanceErr. DryRun
# reported both, Execute swallowed both. (2) A resolver's Validate is now INVOKED by the executor, so
# a refusal expressed only there stops being dead code — reported as ErrMsgResolverRefused, distinct
# from ErrMsgResolverFailed, because one names a fault in the resolver and the other in the document.
# (3) if/for/switch failures now obey the CONTEXT's error strategy, not only onerror=. The fix half is
# that their parse DISCARDED the tag attributes, so onerror=/default= were structurally unreachable
# on a block construct; the fallback half means under a `remove` renderer a mistyped in="inpt.sources"
# now renders an empty loop where it used to raise. KEPT DELIBERATELY — the alternative needs a
# site-kind discriminator inside getErrorStrategy, reintroducing the two-shapes fork this cycle
# removes, and a renderer choosing `remove` asked for lenient rendering. aiv's renderTemplate uses it.
# NEW API (not a break — never shipped in an error-less shape): Template.DeclaredInputs() /
# DeclaredInputKeys() now return (value, error), and A WIRE PROJECTION MUST CHECK IT. They used to
# return a well-formed but PARTIAL contract for a chain the executor refuses (cycle, missing parent,
# over-deep) — a third view of one template agreeing with neither Execute nor DryRun. Rule pinned by
# test: the walk errors in exactly the cases ExecuteWithContext refuses to render, with one named
# carve-out (a TemplateExecutor that is not a templateProvider resolves the chain but cannot read its
# specs → ErrMsgInheritanceSpecsUnavailable). The partial map is still returned WITH the error:
# displaying what is known is fine, publishing it as the contract is not. Returned *InputDefs are
# DEEP COPIES — the accessors handed out live pointers into a registered PARENT's parsed spec, so a
# caller normalising a default in place corrupted every future and concurrent render of a template it
# never named.
# ALSO: extends merges the declaration chain (child-wins at every level, so a parent's body resolves
# against the declarations the PARENT made and parent defaults apply); a parent with frontmatter used
# to splice ---\n…\n--- into the child's output as literal text (unrecorded, and on the same path —
# fixing the merge alone yields a document whose inputs bind and whose body carries stray YAML);
# Template.Explain bypassed inheritance, so a document EXPLAINED differently than it RENDERED;
# onerror= is now validated on block constructs and on individual elseif/case branches, where the
# old gap failed INVERTED (resolution stops once the key is present and an unrecognised value parses
# to throw, so onerror="remov" HARD-FAILS under a renderer configured never to hard-fail);
# docs/template-syntax.md gains a normative Error recourse section, because onerror=/default=/keepraw
# were specified NOWHERE outside CHANGELOG prose while this cycle widened them; new runnable
# examples/09-typed-inputs, which found a gap, which is the point of writing it.
# THE LESSON: ~100 inheritance tests existed and NOT ONE covered the interaction between inheritance
# and frontmatter — the seam where five of six defects lived. Feature coverage is not interaction
# coverage. The review pass then reproduced it: three tests for a new equivalence rule, ALL GREEN
# while the rule was false at two boundaries. Fail-open — newTemplateWithConfig nils inheritanceInfo
# whenever extraction failed, so testing the info before the error made the error branch unreachable
# dead code, returning a clean contract with a NIL ERROR for a document Execute refuses; strictly
# worse than the gap being closed, since the new signature invites "nil error ⇒ safe to publish".
# Two ifs, and their ORDER was the whole property. Fail-closed — ResolveInheritance refuses only when
# a parent is DEMANDED past the bound and so resolves maxDepth+1, while the new walk bounded at
# maxDepth reported DepthExceeded for a chain the executor renders: reusing the resolver's maxDepth
# VALUE is not reusing its RULE. A test suite for a claimed equivalence must be written from the
# BOUNDARIES OF THE CLAIM, not from the cases that motivated it. And: FIXING A DEFECT CAN CREATE ONE —
# nothing about the onerror= lint changed; it became wrong when the construct it declined to check
# stopped being inert.
#
# v0.23.0 (DC12-promulgate): Errors becomes the ANALYSIS-COMPLETENESS CHANNEL, and main gets a
# clean release line. v0.22.0 made DryRun find everything; this makes it SAY SO when it cannot,
# which is the other half of the same contract — a walk that gives up silently is indistinguishable
# from a walk that found nothing, and "found nothing" is the accusation.
# THE PREMISE THAT WAS WRONG: Valid was ASSIGNED from len(Errors) > 0, so it carried no information
# of its own and every new reason to report an incomplete ANALYSIS silently restated itself as the
# stronger, usually untrue claim that the TEMPLATE is invalid. The two are now separate questions
# with separate writers — reportIncompleteAndInvalid where the cause proves ExecuteWithContext
# fails (today only unresolvable inheritance), reportIncomplete where it only proves the walk
# stopped short. New AnalysisComplete() gives the gate a name a consumer can call instead of a
# paragraph they must read. Errors has exactly ONE writer and a test parses this package's own AST
# to keep it that way: a channel written from scattered points across a recursive walk is one
# nobody can audit, and auditability is the entire value here.
# FIVE PLACES THE WALK GAVE UP, ONE OF WHICH REPORTED: expressionIdentifiersOrEmpty swallowed every
# malformed eval= at three call sites, justified by a doc comment claiming the parser already
# reported it — false on both halves, since ParseExpression runs only in the evaluator and Errors
# had one writer. Twelve lines above it, ExpressionIdentifiers' own contract stated the rule the
# wrapper broke. Plus: extends-with-no-engine (no signal at all), an unreadable extends declaration
# (the error was discarded at parse), an absent name= on var/input (a reference whose target is
# unknown, reported as if known), and a walker with no default arm — where an unhandled node kind
# took its ENTIRE SUBTREE with it, silently.
# FOUND WHILE FIXING, AND WORSE THAN THE BUGS WE CAME FOR: parseConditional built every branch
# after the first with the position of the tag that TERMINATED it, and the last with the closing
# {~/exons.if~}. executeConditional reports a failing branch expression at that field, so this was
# reaching USERS as wrong line numbers in runtime errors long before it reached any debug surface.
# Also: generatePlaceholders had no BlockNode arm, so one DryRunResult described two different
# documents — references inside a block reported, the block's body rendering as empty; exons.input
# previewed as the literal "{{exons.input}}", every input in a document the same opaque token;
# String() printed neither Inputs nor Switches, so an author read a document with no inputs in it;
# and Explain still carried BOTH gaps DryRun closed in v0.22.0.
# ALSO: main was fast-forwarded from v0.16.0 and v0.17.0-v0.22.0 gained clean SemVer tags on their
# existing commits. The format had shipped six releases with no promoted release line.
#
# v0.22.0: DryRun becomes COMPLETE, and states the contract it now satisfies. DryRun is the only
# sound static-analysis surface a consumer has — the AST is package-internal and unimportable — so
# a consumer deciding "this declared input is referenced nowhere" can only be as right as DryRun is
# complete, and that verdict licenses telling an author to delete working code. Under-reporting is
# therefore not a smaller bug here but a different one, which is why the fix ships with a STATED
# contract (DryRunResult's doc comment) rather than merely more coverage.
# THE ONE THAT MATTERED: processTagNodeForDryRun never recursed into a block tag's children, so
# {~exons.message role="user"~}{~exons.input name="tone" /~}{~/exons.message~} produced ZERO input
# references. exons.message wraps essentially every real prompt body — the miss was the COMMON case,
# not an edge case, and it was entirely untested (the full suite stayed green after the fix landed).
# Also closed: elseif conditions were reduced to a boolean and discarded; switches were invisible in
# their ENTIRETY (no dispatch expression, no case recorded anywhere); BlockNode had no walker arm;
# and DryRun walked the RAW ast while ExecuteWithContext walks the inheritance-resolved one, so an
# extends-child was analysed as a document that never runs. New public ExpressionIdentifiers()
# resolves eval= identifiers through this library's own expression parser, so a consumer never
# re-scans a grammar it cannot reach — the failure that killed the same rule downstream four times.
# What stays open does so in the SAFE direction (over-reports USE, never under-reports it): loop-var
# shadowing, include recursion (structurally moot — the include boundary drops the input root), and
# the one genuinely unclosable case, a third-party resolver attribute naming a context path, for
# which every resolver's attributes are reported in full.
# v0.21.2: The v0.21.1 guarantee was falsely COMPLETE — the map KEY path was not swept. A slice
# cannot be a map key, but a byte ARRAY can, so map[[16]byte]string rendered its keys as
# `104, 101, …` while every value was correctly withheld. Found in re-review, and it is the same
# mistake at smaller scale: a redactor that states an absolute and misses one path is worse than one
# that states a scope, because the claim is what the next reader trusts. Keys now go through the
# sweep. Also corrected, no behaviour change: contextWithInputs' comment claimed a thread-safety
# property was restored, when deepCopyValue returns structs/pointers/[]byte/non-string-keyed maps BY
# REFERENCE — the two binding paths AGREE, which is the accurate claim, and widening belongs in
# deepCopyValue; and exons.input's depth bound is reached at a shallower DATA depth than exons.var's
# because the sweep flattens pointers, so a deeply pointer-nested ordinary value can elide here and
# render whole there — accepted (over-eliding is the safe direction; not incrementing on pointers is
# what `type P *P` turns into a hang).
# v0.21.1: The binary guarantee was not one. withholdBinary swept slices, maps and pointers but
# had NO reflect.Struct arm, while renderValue has an explicit one that walks exported fields and
# renders a uint8-element slice as string(rv.Bytes()) — so a Go caller binding the most natural
# upload shape there is, `struct{ Name string; Body []byte }`, pasted the entire file body into
# the prompt, through the one function written to prevent exactly that. Byte ARRAYS ([32]byte)
# escaped too, rendering as a list of small integers, and the depth bound FAILED OPEN: the sweep
# flattens pointers, so a byte slice it handed back raw at its bound was reached by renderValue
# well inside its own. All three are closed; the sweep now mirrors renderValue's traversal kind
# for kind, and TestWithholdBinaryTraversesEveryKindRenderValueDoes pins that parity with a
# POSITIVE assertion on the withheld marker — its predecessor asserted only that the secret
# string was absent, which an untraversed byte array passes while leaking every byte.
# ⚠ A byte slice is withheld even when it holds UTF-8 TEXT. The shape carries no evidence of
# which it is, and a text file read into a []byte is as much an accidental paste as a PDF; a
# caller that means to inline a document's text binds a string.
# Also fixed: fileManifestEntries claimed ANY list of maps carrying a `name` — which describes a
# list of named objects, not a file list — and rendered `[{"name":"GPT-4","provider":"openai"}]`
# as bullets with `provider` SILENTLY DROPPED; it now requires every element's keys to be drawn
# from {name,mime_type,size_bytes} AND at least one file-specific key. contextWithInputs merged
# caller bindings SHALLOWLY where Context.Get returns the live value, weakening a documented
# thread-safety property (Spec.BindInputs, the sibling path, already deep-copied); and a nil
# `input` root took the not-a-map exit, so declared defaults silently did not apply. An `error`
# value also rendered as a struct dump, because the pointer arm dereferenced it before
# renderValue could reach its error case. No API change. Consumed by aigentverse DC106-vocative.
# v0.21.0: A declared input becomes its own word. New {~exons.input name="x" /~} verb, and
# — the real change — frontmatter `inputs:` STOPS BEING INERT: nothing in Execute had ever
# read Spec.Inputs, and InputDef.Default had no application site anywhere in the library.
# Declared inputs are now injected into the execution Context under the reserved `input`
# root with their defaults applied, so {~exons.input name="tone"~} IS the path input.tone and
# eval="input.verbose" / in="input.sources" work with no grammar change to if/for. exons.var
# is UNCHANGED and not deprecated — it is the context-variable verb; the defect was that it
# was ALSO the input verb, which made "declared but never referenced" undecidable no matter
# how good the analysis. A declared input with neither a bound value nor a default is PRESENT
# and nil, so an unbound optional list iterates zero times and an unbound boolean is falsy;
# the payoff is PRESENT ⇔ DECLARED, which makes an absent name a reportable author typo.
# ⚠ BEHAVIOUR CHANGES, by tag pattern, for a document that declares `inputs:`:
#   {~exons.var name="input.x"~}   miss → hit (renders the default or empty)
#   onerror="keepraw" on the above  literal tag text → the value
#   eval="input"                    falsy → TRUTHY (a non-empty map)
#   any exons.var miss              did-you-mean lists now include "input"
#   TokenCount                      shifts by the rendered defaults
# data["input"] = "a string" is NOT affected: injection no-ops when the reserved root holds a
# non-map, because that is the most idiomatic key name in a prompt library and an include
# copies its attributes down as strings, letting a DOCUMENT put one there.
# Also: exons.input withholds byte slices at every depth (renderValue renders a uint8 slice
# as text, correct for exons.var and catastrophic for an uploaded file) and renders a list of
# {name,mime_type,size_bytes} maps as a filename manifest; new Spec.BindInputs /
# Spec.ValidateInputBinding as the pre-render binding contract (which is why exons.input
# refuses a `required=` attribute); new DryRunResult.Inputs []InputReference as the sound
# analysis surface; DryRun's ResolverReference.Registered is now ASKED of the registry rather
# than hardcoded true; AttrJoin/AttrTz/AttrLayout mirrored into the public constants.
# Known gaps left alone: a resolver's Validate is never invoked by the executor (exons.input
# therefore enforces via a helper both Validate and Resolve call), and Template.Explain
# bypasses inheritance resolution. Consumed by aigentverse MP-LEXEME (DC106-vocative).
# v0.20.0: The two halves of v0.19.0's input vocabulary that could not be USED.
# (1) {~exons.var~} rendered every non-scalar with fmt.Sprintf("%v"), so a multiselect
# or sort value reached the MODEL as `[cost speed]` and an associate value as
# `[map[left:eu right:gdpr]]` — exactly the kinds v0.19.0 added. Values now render as
# prose (list `a, b`; object `k: v` with keys SORTED since a Go map has no order;
# nested composites delimited `[a, b]` / `(k: v)`), with a new `join` attribute for the
# top-level separator. ⚠ A behaviour change for anyone parsing the %v form — the test
# asserting "[a b]" had pinned the defect as the contract.
# (2) Spec.Inputs is a Go map, so authored input order died at unmarshal and every form
# projection had to sort by key. Spec.UnmarshalYAML (via a `type rawSpec Spec` alias, so
# no existing decode behaviour changes) now records it into Spec.InputOrder; read it via
# the TOTAL Spec.OrderedInputKeys(). Serializes as `input_order` in YAML and JSON, so it
# survives a projection-only round-trip; a hand-written one overrides and is validated.
# v0.19.0: Prompt `subtype` discriminator (fragment|template) + the complete InputDef
# kind vocabulary (text/number/boolean/select/multiselect/file-upload/sort/associate).
# Both are DECLARATION-ONLY and ADVISORY — Spec.Validate gained no checks and rejects
# nothing it previously accepted; go-exons declares, the executing system validates.
# subtype serializes only alongside `type` (a subtype refining nothing is meaningless).
# New InputDef fields: associate_with (right-hand set of the n:n associate kind),
# accept + max_size_bytes (per file) + max_files (count) for file-upload. Fixes a live
# defect: schema/exons.schema.json is additionalProperties:false on InputDef but never
# gained label/options from v0.16.0, so the published schema REJECTED valid documents;
# its type enum is removed rather than extended, since an enum contradicts an open
# advisory vocabulary. Consumed by aigentverse MP-STENCIL (DC103-stencil/DC104-quill).
# v0.18.0: New {~exons.now~} built-in OUTPUT tag — prints a formatted reference time
# into body text (curated named formats iso/date/datetime/time/year/month/day/weekday/
# unix/rfc1123/date-de, optional tz= IANA zone, layout= raw-Go escape hatch). Distinct
# from the eval-only date/time expression functions, which have no output path. The
# reference time is seeded per render via the reserved ContextKeyReferenceTime data key
# (falls back to time.Now()). Consumed by aigentverse DC92-chronos.
# v0.17.0: A2A Agent Card upgraded to spec v1.0.1 (a2a.proto @ v1.0.1). The retired
# v0.3 shape (url + top-level protocolVersion + metadata) is REPLACED by
# supportedInterfaces[] (per-interface protocolVersion), capabilities.extensions[]
# for vendor metadata, and RFC-7515 JWS signatures[] (§8.4). New in the a2a package:
# AgentCard.CanonicalPayload (RFC-8785/JCS), EncodeProtectedHeader, JWSSigningInput,
# AttachDetachedSignature, VerifySignatures (signer/verifier injected — go-exons
# never holds a key), and offline AgentCard.Validate conformance. CompileAgentCard
# now takes SupportedInterfaces/Extensions and synthesizes a skill when none declared.
# New dep: github.com/gowebpki/jcs (RFC 8785). Consumed by aigentverse DC82-emissary.
custom:
  description: Agent specification format for Go — exons define what agents do
  go_version: "1.24"
  repository: https://github.com/itsatony/go-exons
  license: MIT
  website: https://exons.ai
