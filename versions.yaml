manifest_version: "1.0"
project:
  name: go-exons
  version: 0.23.0
# v0.23.0 (DC12-promulgate): Errors becomes the ANALYSIS-COMPLETENESS CHANNEL, and main gets a
# clean release line. v0.22.0 made DryRun find everything; this makes it SAY SO when it cannot,
# which is the other half of the same contract — a walk that gives up silently is indistinguishable
# from a walk that found nothing, and "found nothing" is the accusation.
# THE PREMISE THAT WAS WRONG: Valid was ASSIGNED from len(Errors) > 0, so it carried no information
# of its own and every new reason to report an incomplete ANALYSIS silently restated itself as the
# stronger, usually untrue claim that the TEMPLATE is invalid. The two are now separate questions
# with separate writers — reportIncompleteAndInvalid where the cause proves ExecuteWithContext
# fails (today only unresolvable inheritance), reportIncomplete where it only proves the walk
# stopped short. New AnalysisComplete() gives the gate a name a consumer can call instead of a
# paragraph they must read. Errors has exactly ONE writer and a test parses this package's own AST
# to keep it that way: a channel written from scattered points across a recursive walk is one
# nobody can audit, and auditability is the entire value here.
# FIVE PLACES THE WALK GAVE UP, ONE OF WHICH REPORTED: expressionIdentifiersOrEmpty swallowed every
# malformed eval= at three call sites, justified by a doc comment claiming the parser already
# reported it — false on both halves, since ParseExpression runs only in the evaluator and Errors
# had one writer. Twelve lines above it, ExpressionIdentifiers' own contract stated the rule the
# wrapper broke. Plus: extends-with-no-engine (no signal at all), an unreadable extends declaration
# (the error was discarded at parse), an absent name= on var/input (a reference whose target is
# unknown, reported as if known), and a walker with no default arm — where an unhandled node kind
# took its ENTIRE SUBTREE with it, silently.
# FOUND WHILE FIXING, AND WORSE THAN THE BUGS WE CAME FOR: parseConditional built every branch
# after the first with the position of the tag that TERMINATED it, and the last with the closing
# {~/exons.if~}. executeConditional reports a failing branch expression at that field, so this was
# reaching USERS as wrong line numbers in runtime errors long before it reached any debug surface.
# Also: generatePlaceholders had no BlockNode arm, so one DryRunResult described two different
# documents — references inside a block reported, the block's body rendering as empty; exons.input
# previewed as the literal "{{exons.input}}", every input in a document the same opaque token;
# String() printed neither Inputs nor Switches, so an author read a document with no inputs in it;
# and Explain still carried BOTH gaps DryRun closed in v0.22.0.
# ALSO: main was fast-forwarded from v0.16.0 and v0.17.0-v0.22.0 gained clean SemVer tags on their
# existing commits. The format had shipped six releases with no promoted release line.
#
# v0.22.0: DryRun becomes COMPLETE, and states the contract it now satisfies. DryRun is the only
# sound static-analysis surface a consumer has — the AST is package-internal and unimportable — so
# a consumer deciding "this declared input is referenced nowhere" can only be as right as DryRun is
# complete, and that verdict licenses telling an author to delete working code. Under-reporting is
# therefore not a smaller bug here but a different one, which is why the fix ships with a STATED
# contract (DryRunResult's doc comment) rather than merely more coverage.
# THE ONE THAT MATTERED: processTagNodeForDryRun never recursed into a block tag's children, so
# {~exons.message role="user"~}{~exons.input name="tone" /~}{~/exons.message~} produced ZERO input
# references. exons.message wraps essentially every real prompt body — the miss was the COMMON case,
# not an edge case, and it was entirely untested (the full suite stayed green after the fix landed).
# Also closed: elseif conditions were reduced to a boolean and discarded; switches were invisible in
# their ENTIRETY (no dispatch expression, no case recorded anywhere); BlockNode had no walker arm;
# and DryRun walked the RAW ast while ExecuteWithContext walks the inheritance-resolved one, so an
# extends-child was analysed as a document that never runs. New public ExpressionIdentifiers()
# resolves eval= identifiers through this library's own expression parser, so a consumer never
# re-scans a grammar it cannot reach — the failure that killed the same rule downstream four times.
# What stays open does so in the SAFE direction (over-reports USE, never under-reports it): loop-var
# shadowing, include recursion (structurally moot — the include boundary drops the input root), and
# the one genuinely unclosable case, a third-party resolver attribute naming a context path, for
# which every resolver's attributes are reported in full.
# v0.21.2: The v0.21.1 guarantee was falsely COMPLETE — the map KEY path was not swept. A slice
# cannot be a map key, but a byte ARRAY can, so map[[16]byte]string rendered its keys as
# `104, 101, …` while every value was correctly withheld. Found in re-review, and it is the same
# mistake at smaller scale: a redactor that states an absolute and misses one path is worse than one
# that states a scope, because the claim is what the next reader trusts. Keys now go through the
# sweep. Also corrected, no behaviour change: contextWithInputs' comment claimed a thread-safety
# property was restored, when deepCopyValue returns structs/pointers/[]byte/non-string-keyed maps BY
# REFERENCE — the two binding paths AGREE, which is the accurate claim, and widening belongs in
# deepCopyValue; and exons.input's depth bound is reached at a shallower DATA depth than exons.var's
# because the sweep flattens pointers, so a deeply pointer-nested ordinary value can elide here and
# render whole there — accepted (over-eliding is the safe direction; not incrementing on pointers is
# what `type P *P` turns into a hang).
# v0.21.1: The binary guarantee was not one. withholdBinary swept slices, maps and pointers but
# had NO reflect.Struct arm, while renderValue has an explicit one that walks exported fields and
# renders a uint8-element slice as string(rv.Bytes()) — so a Go caller binding the most natural
# upload shape there is, `struct{ Name string; Body []byte }`, pasted the entire file body into
# the prompt, through the one function written to prevent exactly that. Byte ARRAYS ([32]byte)
# escaped too, rendering as a list of small integers, and the depth bound FAILED OPEN: the sweep
# flattens pointers, so a byte slice it handed back raw at its bound was reached by renderValue
# well inside its own. All three are closed; the sweep now mirrors renderValue's traversal kind
# for kind, and TestWithholdBinaryTraversesEveryKindRenderValueDoes pins that parity with a
# POSITIVE assertion on the withheld marker — its predecessor asserted only that the secret
# string was absent, which an untraversed byte array passes while leaking every byte.
# ⚠ A byte slice is withheld even when it holds UTF-8 TEXT. The shape carries no evidence of
# which it is, and a text file read into a []byte is as much an accidental paste as a PDF; a
# caller that means to inline a document's text binds a string.
# Also fixed: fileManifestEntries claimed ANY list of maps carrying a `name` — which describes a
# list of named objects, not a file list — and rendered `[{"name":"GPT-4","provider":"openai"}]`
# as bullets with `provider` SILENTLY DROPPED; it now requires every element's keys to be drawn
# from {name,mime_type,size_bytes} AND at least one file-specific key. contextWithInputs merged
# caller bindings SHALLOWLY where Context.Get returns the live value, weakening a documented
# thread-safety property (Spec.BindInputs, the sibling path, already deep-copied); and a nil
# `input` root took the not-a-map exit, so declared defaults silently did not apply. An `error`
# value also rendered as a struct dump, because the pointer arm dereferenced it before
# renderValue could reach its error case. No API change. Consumed by aigentverse DC106-vocative.
# v0.21.0: A declared input becomes its own word. New {~exons.input name="x" /~} verb, and
# — the real change — frontmatter `inputs:` STOPS BEING INERT: nothing in Execute had ever
# read Spec.Inputs, and InputDef.Default had no application site anywhere in the library.
# Declared inputs are now injected into the execution Context under the reserved `input`
# root with their defaults applied, so {~exons.input name="tone"~} IS the path input.tone and
# eval="input.verbose" / in="input.sources" work with no grammar change to if/for. exons.var
# is UNCHANGED and not deprecated — it is the context-variable verb; the defect was that it
# was ALSO the input verb, which made "declared but never referenced" undecidable no matter
# how good the analysis. A declared input with neither a bound value nor a default is PRESENT
# and nil, so an unbound optional list iterates zero times and an unbound boolean is falsy;
# the payoff is PRESENT ⇔ DECLARED, which makes an absent name a reportable author typo.
# ⚠ BEHAVIOUR CHANGES, by tag pattern, for a document that declares `inputs:`:
#   {~exons.var name="input.x"~}   miss → hit (renders the default or empty)
#   onerror="keepraw" on the above  literal tag text → the value
#   eval="input"                    falsy → TRUTHY (a non-empty map)
#   any exons.var miss              did-you-mean lists now include "input"
#   TokenCount                      shifts by the rendered defaults
# data["input"] = "a string" is NOT affected: injection no-ops when the reserved root holds a
# non-map, because that is the most idiomatic key name in a prompt library and an include
# copies its attributes down as strings, letting a DOCUMENT put one there.
# Also: exons.input withholds byte slices at every depth (renderValue renders a uint8 slice
# as text, correct for exons.var and catastrophic for an uploaded file) and renders a list of
# {name,mime_type,size_bytes} maps as a filename manifest; new Spec.BindInputs /
# Spec.ValidateInputBinding as the pre-render binding contract (which is why exons.input
# refuses a `required=` attribute); new DryRunResult.Inputs []InputReference as the sound
# analysis surface; DryRun's ResolverReference.Registered is now ASKED of the registry rather
# than hardcoded true; AttrJoin/AttrTz/AttrLayout mirrored into the public constants.
# Known gaps left alone: a resolver's Validate is never invoked by the executor (exons.input
# therefore enforces via a helper both Validate and Resolve call), and Template.Explain
# bypasses inheritance resolution. Consumed by aigentverse MP-LEXEME (DC106-vocative).
# v0.20.0: The two halves of v0.19.0's input vocabulary that could not be USED.
# (1) {~exons.var~} rendered every non-scalar with fmt.Sprintf("%v"), so a multiselect
# or sort value reached the MODEL as `[cost speed]` and an associate value as
# `[map[left:eu right:gdpr]]` — exactly the kinds v0.19.0 added. Values now render as
# prose (list `a, b`; object `k: v` with keys SORTED since a Go map has no order;
# nested composites delimited `[a, b]` / `(k: v)`), with a new `join` attribute for the
# top-level separator. ⚠ A behaviour change for anyone parsing the %v form — the test
# asserting "[a b]" had pinned the defect as the contract.
# (2) Spec.Inputs is a Go map, so authored input order died at unmarshal and every form
# projection had to sort by key. Spec.UnmarshalYAML (via a `type rawSpec Spec` alias, so
# no existing decode behaviour changes) now records it into Spec.InputOrder; read it via
# the TOTAL Spec.OrderedInputKeys(). Serializes as `input_order` in YAML and JSON, so it
# survives a projection-only round-trip; a hand-written one overrides and is validated.
# v0.19.0: Prompt `subtype` discriminator (fragment|template) + the complete InputDef
# kind vocabulary (text/number/boolean/select/multiselect/file-upload/sort/associate).
# Both are DECLARATION-ONLY and ADVISORY — Spec.Validate gained no checks and rejects
# nothing it previously accepted; go-exons declares, the executing system validates.
# subtype serializes only alongside `type` (a subtype refining nothing is meaningless).
# New InputDef fields: associate_with (right-hand set of the n:n associate kind),
# accept + max_size_bytes (per file) + max_files (count) for file-upload. Fixes a live
# defect: schema/exons.schema.json is additionalProperties:false on InputDef but never
# gained label/options from v0.16.0, so the published schema REJECTED valid documents;
# its type enum is removed rather than extended, since an enum contradicts an open
# advisory vocabulary. Consumed by aigentverse MP-STENCIL (DC103-stencil/DC104-quill).
# v0.18.0: New {~exons.now~} built-in OUTPUT tag — prints a formatted reference time
# into body text (curated named formats iso/date/datetime/time/year/month/day/weekday/
# unix/rfc1123/date-de, optional tz= IANA zone, layout= raw-Go escape hatch). Distinct
# from the eval-only date/time expression functions, which have no output path. The
# reference time is seeded per render via the reserved ContextKeyReferenceTime data key
# (falls back to time.Now()). Consumed by aigentverse DC92-chronos.
# v0.17.0: A2A Agent Card upgraded to spec v1.0.1 (a2a.proto @ v1.0.1). The retired
# v0.3 shape (url + top-level protocolVersion + metadata) is REPLACED by
# supportedInterfaces[] (per-interface protocolVersion), capabilities.extensions[]
# for vendor metadata, and RFC-7515 JWS signatures[] (§8.4). New in the a2a package:
# AgentCard.CanonicalPayload (RFC-8785/JCS), EncodeProtectedHeader, JWSSigningInput,
# AttachDetachedSignature, VerifySignatures (signer/verifier injected — go-exons
# never holds a key), and offline AgentCard.Validate conformance. CompileAgentCard
# now takes SupportedInterfaces/Extensions and synthesizes a skill when none declared.
# New dep: github.com/gowebpki/jcs (RFC 8785). Consumed by aigentverse DC82-emissary.
custom:
  description: Agent specification format for Go — exons define what agents do
  go_version: "1.24"
  repository: https://github.com/itsatony/go-exons
  license: MIT
  website: https://exons.ai
