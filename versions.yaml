manifest_version: "1.0"
project:
  name: go-exons
  version: 0.21.0
# v0.21.0: A declared input becomes its own word. New {~exons.input name="x" /~} verb, and
# — the real change — frontmatter `inputs:` STOPS BEING INERT: nothing in Execute had ever
# read Spec.Inputs, and InputDef.Default had no application site anywhere in the library.
# Declared inputs are now injected into the execution Context under the reserved `input`
# root with their defaults applied, so {~exons.input name="tone"~} IS the path input.tone and
# eval="input.verbose" / in="input.sources" work with no grammar change to if/for. exons.var
# is UNCHANGED and not deprecated — it is the context-variable verb; the defect was that it
# was ALSO the input verb, which made "declared but never referenced" undecidable no matter
# how good the analysis. A declared input with neither a bound value nor a default is PRESENT
# and nil, so an unbound optional list iterates zero times and an unbound boolean is falsy;
# the payoff is PRESENT ⇔ DECLARED, which makes an absent name a reportable author typo.
# ⚠ BEHAVIOUR CHANGES, by tag pattern, for a document that declares `inputs:`:
#   {~exons.var name="input.x"~}   miss → hit (renders the default or empty)
#   onerror="keepraw" on the above  literal tag text → the value
#   eval="input"                    falsy → TRUTHY (a non-empty map)
#   any exons.var miss              did-you-mean lists now include "input"
#   TokenCount                      shifts by the rendered defaults
# data["input"] = "a string" is NOT affected: injection no-ops when the reserved root holds a
# non-map, because that is the most idiomatic key name in a prompt library and an include
# copies its attributes down as strings, letting a DOCUMENT put one there.
# Also: exons.input withholds byte slices at every depth (renderValue renders a uint8 slice
# as text, correct for exons.var and catastrophic for an uploaded file) and renders a list of
# {name,mime_type,size_bytes} maps as a filename manifest; new Spec.BindInputs /
# Spec.ValidateInputBinding as the pre-render binding contract (which is why exons.input
# refuses a `required=` attribute); new DryRunResult.Inputs []InputReference as the sound
# analysis surface; DryRun's ResolverReference.Registered is now ASKED of the registry rather
# than hardcoded true; AttrJoin/AttrTz/AttrLayout mirrored into the public constants.
# Known gaps left alone: a resolver's Validate is never invoked by the executor (exons.input
# therefore enforces via a helper both Validate and Resolve call), and Template.Explain
# bypasses inheritance resolution. Consumed by aigentverse MP-LEXEME (DC106-vocative).
# v0.20.0: The two halves of v0.19.0's input vocabulary that could not be USED.
# (1) {~exons.var~} rendered every non-scalar with fmt.Sprintf("%v"), so a multiselect
# or sort value reached the MODEL as `[cost speed]` and an associate value as
# `[map[left:eu right:gdpr]]` — exactly the kinds v0.19.0 added. Values now render as
# prose (list `a, b`; object `k: v` with keys SORTED since a Go map has no order;
# nested composites delimited `[a, b]` / `(k: v)`), with a new `join` attribute for the
# top-level separator. ⚠ A behaviour change for anyone parsing the %v form — the test
# asserting "[a b]" had pinned the defect as the contract.
# (2) Spec.Inputs is a Go map, so authored input order died at unmarshal and every form
# projection had to sort by key. Spec.UnmarshalYAML (via a `type rawSpec Spec` alias, so
# no existing decode behaviour changes) now records it into Spec.InputOrder; read it via
# the TOTAL Spec.OrderedInputKeys(). Serializes as `input_order` in YAML and JSON, so it
# survives a projection-only round-trip; a hand-written one overrides and is validated.
# v0.19.0: Prompt `subtype` discriminator (fragment|template) + the complete InputDef
# kind vocabulary (text/number/boolean/select/multiselect/file-upload/sort/associate).
# Both are DECLARATION-ONLY and ADVISORY — Spec.Validate gained no checks and rejects
# nothing it previously accepted; go-exons declares, the executing system validates.
# subtype serializes only alongside `type` (a subtype refining nothing is meaningless).
# New InputDef fields: associate_with (right-hand set of the n:n associate kind),
# accept + max_size_bytes (per file) + max_files (count) for file-upload. Fixes a live
# defect: schema/exons.schema.json is additionalProperties:false on InputDef but never
# gained label/options from v0.16.0, so the published schema REJECTED valid documents;
# its type enum is removed rather than extended, since an enum contradicts an open
# advisory vocabulary. Consumed by aigentverse MP-STENCIL (DC103-stencil/DC104-quill).
# v0.18.0: New {~exons.now~} built-in OUTPUT tag — prints a formatted reference time
# into body text (curated named formats iso/date/datetime/time/year/month/day/weekday/
# unix/rfc1123/date-de, optional tz= IANA zone, layout= raw-Go escape hatch). Distinct
# from the eval-only date/time expression functions, which have no output path. The
# reference time is seeded per render via the reserved ContextKeyReferenceTime data key
# (falls back to time.Now()). Consumed by aigentverse DC92-chronos.
# v0.17.0: A2A Agent Card upgraded to spec v1.0.1 (a2a.proto @ v1.0.1). The retired
# v0.3 shape (url + top-level protocolVersion + metadata) is REPLACED by
# supportedInterfaces[] (per-interface protocolVersion), capabilities.extensions[]
# for vendor metadata, and RFC-7515 JWS signatures[] (§8.4). New in the a2a package:
# AgentCard.CanonicalPayload (RFC-8785/JCS), EncodeProtectedHeader, JWSSigningInput,
# AttachDetachedSignature, VerifySignatures (signer/verifier injected — go-exons
# never holds a key), and offline AgentCard.Validate conformance. CompileAgentCard
# now takes SupportedInterfaces/Extensions and synthesizes a skill when none declared.
# New dep: github.com/gowebpki/jcs (RFC 8785). Consumed by aigentverse DC82-emissary.
custom:
  description: Agent specification format for Go — exons define what agents do
  go_version: "1.24"
  repository: https://github.com/itsatony/go-exons
  license: MIT
  website: https://exons.ai
